services:
  - type: web
    name: opthalmicai-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENABLE_SEGMENTATION
        value: "false"
      - key: ENABLE_GRADCAM
        value: "false"
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: AUTH_SALT
        generateValue: true
    autoDeployTrigger: commit

  - type: web
    name: opthalmicai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./out
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_OVERVIEW_YT
        value: https://www.youtube.com/embed/opcj0hZPnxU
    autoDeployTrigger: commit
