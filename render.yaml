services:
  - type: web
    name: opthalmicai-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit

  - type: web
    name: opthalmicai-frontend
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_OVERVIEW_YT
        value: https://www.youtube.com/embed/opcj0hZPnxU
    autoDeployTrigger: commit
